<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0c1512"/><path d="M1060 0 1200 140M1120 0 1200 80" stroke="#3e5541" stroke-width="1"/><text x="48" y="47" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">ACCESS / WHAT THE REWARD MEANS</text><text x="48" y="105" fill="#f0f0e6" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Two activations. Separate claim windows.</text><text x="48" y="146" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Reported access rules; your own activation screen takes priority.</text><rect x="48" y="192" width="540" height="202" rx="18" fill="#17271f" stroke="#3e5541"/><rect x="612" y="192" width="540" height="202" rx="18" fill="#17271f" stroke="#3e5541"/><g transform="translate(108 267) scale(0.7)"><path d="M0-44 38-22v44L0 44-38 22v-44Z" fill="#293e28" stroke="#d1f378" stroke-width="3"/><path d="M0-28 8-8 28 0 8 8 0 28-8 8-28 0-8-8Z" fill="#d1f378"/><circle r="6" fill="#0c1512"/></g><g transform="translate(672 267) scale(0.7)"><path d="M0-44 38-22v44L0 44-38 22v-44Z" fill="#293e28" stroke="#d1f378" stroke-width="3"/><path d="M0-28 8-8 28 0 8 8 0 28-8 8-28 0-8-8Z" fill="#d1f378"/><circle r="6" fill="#0c1512"/></g><text x="164" y="249" fill="#f0f0e6" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">2026 activation</text><text x="164" y="296" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">14 days</text><text x="164" y="345" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Activate before the displayed deadline.</text><text x="728" y="249" fill="#f0f0e6" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">2027 activation</text><text x="728" y="296" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">14 days</text><text x="728" y="345" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Confirm the separate dates in-game.</text><rect x="48" y="420" width="1104" height="150" rx="18" fill="#17271f" stroke="#3e5541"/><text x="78" y="465" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">ELIGIBILITY MATTERS</text><text x="78" y="507" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">Eligible V-Bucks cosmetics · exclusions include cash purchases and gifts</text><text x="78" y="541" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">Not every Fortnite item is included. Check each offer and your account terms.</text><path d="M48 611L1152 611" fill="none" stroke="#3e5541" stroke-width="2" /><text x="48" y="645" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Original mechanism diagram · no promise of a particular item or future shop rotation</text><text x="960" y="645" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">SHOP TOKEN / 2026</text></svg>