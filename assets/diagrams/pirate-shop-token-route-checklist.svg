<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0c1512"/><path d="M1060 0 1200 140M1120 0 1200 80" stroke="#3e5541" stroke-width="1"/><text x="48" y="47" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">ROUTE PLANNING / A FAIR COMPARISON</text><text x="48" y="105" fill="#f0f0e6" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Count completed openings, not map pins.</text><text x="48" y="146" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Measure comparable sessions, including travel and unsuccessful landings.</text><rect x="48" y="192" width="520" height="370" rx="18" fill="#17271f" stroke="#3e5541"/><rect x="594" y="192" width="558" height="370" rx="18" fill="#17271f" stroke="#3e5541"/><circle cx="88" cy="243" r="15" fill="#2b432d"/><text x="82" y="249" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">1</text><text x="118" y="251" fill="#f0f0e6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Chests actually opened</text><circle cx="88" cy="321" r="15" fill="#2b432d"/><text x="82" y="327" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">2</text><text x="118" y="329" fill="#f0f0e6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">All elapsed minutes</text><circle cx="88" cy="399" r="15" fill="#2b432d"/><text x="82" y="405" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">3</text><text x="118" y="407" fill="#f0f0e6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Mode and date</text><circle cx="88" cy="477" r="15" fill="#2b432d"/><text x="82" y="483" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">4</text><text x="118" y="485" fill="#f0f0e6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Failed or contested landings</text><text x="624" y="243" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">ILLUSTRATIVE EXAMPLE</text><text x="624" y="304" fill="#f0f0e6" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">24 openings ÷ 12 minutes</text><text x="624" y="386" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700">2</text><text x="683" y="381" fill="#f0f0e6" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400">openings / minute</text><text x="624" y="446" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Compare several sessions.</text><text x="624" y="480" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">A faster route gives more attempts;</text><text x="624" y="514" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">it does not prove better per-chest odds.</text><path d="M48 611L1152 611" fill="none" stroke="#3e5541" stroke-width="2" /><text x="48" y="645" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Method diagram, not a verified route or map · example counts are invented for explanation</text><text x="960" y="645" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">SHOP TOKEN / 2026</text></svg>