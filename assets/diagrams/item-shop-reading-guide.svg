<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0c1512"/><path d="M1060 0 1200 140M1120 0 1200 80" stroke="#3e5541" stroke-width="1"/><text x="48" y="47" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">ITEM SHOP / READ A LISTING</text><text x="48" y="105" fill="#f0f0e6" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Three checks before you choose an item</text><text x="48" y="146" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Use the catalogue to compare. Confirm the actual offer inside Fortnite.</text><rect x="48" y="192" width="350" height="378" rx="18" fill="#17271f" stroke="#3e5541"/><rect x="425" y="192" width="350" height="378" rx="18" fill="#17271f" stroke="#3e5541"/><rect x="802" y="192" width="350" height="378" rx="18" fill="#17271f" stroke="#3e5541"/><circle cx="223" cy="278" r="43" fill="#203728" stroke="#d1f378" stroke-width="3"/><path d="M223 278L223 254.35" fill="none" stroke="#d1f378" stroke-width="4" /><path d="M223 278L241.06 287.46" fill="none" stroke="#d1f378" stroke-width="4" /><circle cx="223" cy="278" r="5" fill="#d1f378"/><text x="76" y="370" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">01 / DATA DATE</text><text x="76" y="414" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Read the snapshot time.</text><text x="76" y="448" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">After reset, yesterday’s</text><text x="76" y="482" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">list may be out of date.</text><g transform="translate(600 278) scale(0.95)"><path d="M0-44 38-22v44L0 44-38 22v-44Z" fill="#293e28" stroke="#d1f378" stroke-width="3"/><path d="M0-28 8-8 28 0 8 8 0 28-8 8-28 0-8-8Z" fill="#d1f378"/><circle r="6" fill="#0c1512"/></g><text x="453" y="370" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">02 / OFFER PRICE</text><text x="453" y="414" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Prices are in V-Bucks.</text><text x="453" y="448" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Bundle contents differ.</text><text x="453" y="482" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">No fixed cash equivalent.</text><rect x="932" y="238" width="90" height="82" rx="10" fill="#243b2b" stroke="#d1f378" stroke-width="3"/><path d="m951 278 14 14 39-39" stroke="#d1f378" stroke-width="5" fill="none"/><text x="830" y="370" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">03 / IN-GAME CHECK</text><text x="830" y="414" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Review availability,</text><text x="830" y="448" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">included items and your</text><text x="830" y="482" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">account-specific price.</text><path d="M48 611L1152 611" fill="none" stroke="#3e5541" stroke-width="2" /><text x="48" y="645" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Original reading guide · the catalogue uses third-party Fortnite-API data</text><text x="960" y="645" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">SHOP TOKEN / 2026</text></svg>