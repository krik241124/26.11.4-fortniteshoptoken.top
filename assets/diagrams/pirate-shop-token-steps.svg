<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0c1512"/><path d="M1060 0 1200 140M1120 0 1200 80" stroke="#3e5541" stroke-width="1"/><text x="48" y="47" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">ACQUISITION / FOUR STEPS</text><text x="48" y="105" fill="#f0f0e6" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">From your next drop to the reward screen</text><text x="48" y="146" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">A useful routine creates attempts. It does not guarantee a token.</text><rect x="48" y="190" width="540" height="181" rx="18" fill="#17271f" stroke="#3e5541"/><text x="74" y="233" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">01</text><text x="130" y="234" fill="#f0f0e6" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Check the event</text><text x="75" y="283" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Confirm the current playlist</text><text x="75" y="317" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">and event rules in Fortnite.</text><rect x="612" y="190" width="540" height="181" rx="18" fill="#17271f" stroke="#3e5541"/><text x="638" y="233" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">02</text><text x="694" y="234" fill="#f0f0e6" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Plan a survivable route</text><text x="639" y="283" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Choose nearby chests, equipment</text><text x="639" y="317" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">and an exit if the landing is busy.</text><rect x="48" y="391" width="540" height="181" rx="18" fill="#17271f" stroke="#3e5541"/><text x="74" y="434" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">03</text><text x="130" y="435" fill="#f0f0e6" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Open eligible chests</text><text x="75" y="484" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Ordinary chests are reported eligible.</text><text x="75" y="518" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">There is no verified best chest type.</text><rect x="612" y="391" width="540" height="181" rx="18" fill="#17271f" stroke="#3e5541"/><text x="638" y="434" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">04</text><text x="694" y="435" fill="#f0f0e6" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Review your reward</text><text x="639" y="484" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Watch for the access notification.</text><text x="639" y="518" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Read terms before you activate.</text><path d="M48 611L1152 611" fill="none" stroke="#3e5541" stroke-width="2" /><text x="48" y="645" fill="#c0ceba" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Based on cited reporting in the guide · confirm current rules in your game</text><text x="960" y="645" fill="#d1f378" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">SHOP TOKEN / 2026</text></svg>